name: CI - Production Readiness & Build Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: TypeScript type-check
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://bumiloka.id
